<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img,svg{max-width:100%}</style>
<title>سجل غياب منسوبي المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E9EFED; --line:#D3DDD9; --text:#182A31; --muted:#5C6F76;
  --accent:#0F766E; --accent-ink:#0A5B55; --accent-soft:#D9F0EC; --on-accent:#FFFFFF;
  --absent:#B3261E; --absent-soft:#FBE4E2; --late:#A85F00; --late-soft:#FCEBD1; --early:#5747A6; --early-soft:#E7E3F7; --ok:#1E7A46; --ok-soft:#DDF2E5;
  --shadow:0 1px 2px rgba(23,42,49,.06),0 6px 20px rgba(23,42,49,.06);
  --radius:10px; --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif; --letter:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1A1E; --surface:#16252B; --surface2:#1E3038; --line:#2B3F47; --text:#E4EDEF; --muted:#9AB0B7;
  --accent:#34C9B8; --accent-ink:#8FE3D8; --accent-soft:#163B3A; --on-accent:#08201E;
  --absent:#F08C84; --absent-soft:#3C1E1B; --late:#F0B45A; --late-soft:#3B2B12; --early:#B8ACF2; --early-soft:#2A2445; --ok:#6FD394; --ok-soft:#173526;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --surface:#16252B; --surface2:#1E3038; --line:#2B3F47; --text:#E4EDEF; --muted:#9AB0B7;
  --accent:#34C9B8; --accent-ink:#8FE3D8; --accent-soft:#163B3A; --on-accent:#08201E;
  --absent:#F08C84; --absent-soft:#3C1E1B; --late:#F0B45A; --late-soft:#3B2B12; --early:#B8ACF2; --early-soft:#2A2445; --ok:#6FD394; --ok-soft:#173526;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.3}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-inline-start:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{display:block;font-size:1.05rem}
.brand small{color:var(--muted);display:block;font-size:.8rem;line-height:1.4}
nav a.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:500;cursor:pointer}
nav a.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.nav.active{background:var(--accent-soft);color:var(--accent-ink)}
nav a.nav:hover:not(.active){background:var(--surface2)}
.side-foot{margin-top:auto;font-size:.82rem;color:var(--muted);padding:8px}
.side-foot b{color:var(--text);display:block}
main{padding:22px clamp(14px,3vw,36px) 90px;max-width:1100px;width:100%;min-width:0}
#app>*,.grid2>*,.card{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}.sync.busy i{background:var(--late);animation:pulse 1s infinite}.sync.off i{background:var(--absent)}
@keyframes pulse{50%{opacity:.3}}

/* Cards, grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-inline-start:4px solid var(--accent)}
.stat.absent{border-inline-start-color:var(--absent)}.stat.late{border-inline-start-color:var(--late)}.stat.early{border-inline-start-color:var(--early)}.stat.ok{border-inline-start-color:var(--ok)}
.stat .v{font-size:1.7rem;font-weight:600;line-height:1.2}
.stat .l{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
.f>input,.f>select,.f>textarea{color:var(--text)}
.f>input,.f>select,.f>textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:.95rem}
label.f>input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px;border:0;background:var(--surface);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.seg button.on[data-v="absent"]{background:var(--absent-soft);color:var(--absent)}
.seg button.on[data-v="late"]{background:var(--late-soft);color:var(--late)}
.seg button.on[data-v="early"]{background:var(--early-soft);color:var(--early)}
.check{display:flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--absent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label.f{min-width:140px;flex:1}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--surface2)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}th.sortable.on{color:var(--accent-ink)}th.sortable .arr{font-size:.7rem;opacity:.6}th.sortable.on .arr{opacity:1}
tr:hover td{background:color-mix(in srgb,var(--surface2) 50%,transparent)}
td.actions{white-space:nowrap;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.92rem}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.absent{background:var(--absent-soft);color:var(--absent)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.early{background:var(--early-soft);color:var(--early)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--late-soft);color:var(--late)}
.pill.muted{background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.login .card{width:min(420px,100%)}
.login h1{margin-bottom:4px}
.login .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.error{color:var(--absent);font-size:.88rem;margin-top:6px}

/* Toast, dialog */
.toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--text);width:min(560px,94vw);box-shadow:var(--shadow);direction:rtl}
dialog::backdrop{background:rgba(10,20,25,.5)}
dialog .dl{padding:20px}
dialog h2{margin-bottom:14px}
.dl .row.end{margin-top:16px}

/* Bottom nav on mobile */
.bnav{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:14px 14px 90px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);text-decoration:none;padding:4px 0;cursor:pointer}
  .bnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav a.active{color:var(--accent)}
  .stat .v{font-size:1.4rem}
  th,td{padding:8px 7px}
}

/* Letter (screen preview + print) */
.letter{font-family:var(--letter);color:#000;background:#fff;width:210mm;min-height:296mm;padding:12mm 16mm 12mm;margin:0 auto;font-size:13.5pt;line-height:1.7;position:relative;page-break-after:always;break-after:page}
.letter:last-child{page-break-after:auto;break-after:auto}
.letter .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;font-size:12.5pt;line-height:1.45;margin-bottom:4mm}
.letter .head .r{text-align:right;justify-self:start;font-weight:700;white-space:nowrap}.letter .head .r small{font-weight:400;font-size:11pt;display:block}.letter .head .l{font-size:11pt;display:grid;grid-template-columns:max-content max-content;gap:0 3mm;align-content:start;justify-content:start;justify-self:end;direction:rtl;text-align:right}
.letter .head .logo{width:36mm;height:auto;display:block;margin:0 auto}
.letter .head .logo-ph{width:22mm;height:22mm;border:1px dashed #999;border-radius:50%;display:grid;place-items:center;font-size:9pt;color:#777;margin:0 auto}
.letter .title{text-align:center;font-size:18pt;font-weight:700;margin:2mm 0 3mm;display:flex;justify-content:center;align-items:baseline;gap:10mm;flex-wrap:wrap}
.letter .title small{font-size:10.5pt;font-weight:400}
.letter table.info{width:100%;border-collapse:collapse;font-size:12pt;margin-bottom:4mm}
.letter table.info th,.letter table.info td{border:1px solid #000;padding:1.2mm 2.5mm;text-align:center;line-height:1.5}
.letter table.info th{background:#e8e8e8;font-weight:700;width:28mm;letter-spacing:0;color:#000}
.letter .digits{display:flex;gap:1.5mm;justify-content:flex-start;direction:ltr;padding:1mm 0}
.letter .digits span{width:7.5mm;height:8mm;border:1px solid #000;display:grid;place-items:center;font-size:12pt}
.letter .to{display:flex;justify-content:space-between;gap:16px}
.letter .body{text-align:justify}
.letter .body ul{margin:1mm 0;padding-inline-start:7mm}
.letter .sig{display:flex;justify-content:space-between;gap:10mm;margin-top:2mm}
.letter .sig>div{white-space:nowrap}
.letter hr{border:0;border-top:1.5px solid #000;margin:4mm 0}
.letter .dl{color:#9a9a9a;letter-spacing:.5px}
.letter .dots{border-bottom:1px dotted #333;height:8mm}
.letter .opts div{display:flex;gap:3mm;align-items:baseline}
.letter .opts i{width:5mm;height:5mm;border:1.5px solid #000;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-style:normal;font-size:10pt;transform:translateY(1mm)}
.letter .opts i.on::after{content:'';width:3mm;height:3mm;background:#000;border-radius:50%}
.letter .note{font-size:11pt;margin-top:3mm}
.letter .foot{position:absolute;bottom:6mm;inset-inline:16mm;font-size:9pt;color:#666;display:flex;justify-content:space-between}
#printArea{display:none}
#printArea.rendering{display:block;position:absolute;top:0;left:-3000px;width:210mm;z-index:-1}
#printArea.rendering .letter{margin:0}
.preview{background:#8a9497;padding:16px;overflow:auto;border-radius:var(--radius)}
.preview .letter{box-shadow:0 4px 20px rgba(0,0,0,.35)}
.picklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.picklist label{padding:4px 0;border-bottom:1px solid var(--line)}.picklist label:last-child{border:0}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app,.toast,.bnav,dialog{display:none!important}
  #printArea{display:block}
  .letter{box-shadow:none;margin:0;width:210mm;height:296mm;zoom:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

function buildHTML(state) {
  const tplB64 = $('#tpl').textContent.trim();
  const tpl = new TextDecoder().decode(Uint8Array.from(atob(tplB64), c => c.charCodeAt(0)));
  const json = JSON.stringify(state).replace(/<\//g, '<\\/');
  return tpl.replace(P_TPL, tplB64).replace(P_STATE, json);
}
let saving = false;
async function save(msg) {

      sessionStorage.setItem('absence-view', location.hash || '#dashboard');
      await artifactNS.publish(buildHTML(S));
      toast(msg || 'تم الحفظ');
    } catch (e) {
      saving = false;

      if (code === 'conflict') { toast('تم تحديث البيانات من جهاز آخر، جارٍ إعادة التحميل…'); return; }

      toast('تعذر الحفظ: ' + (e.message || code || 'خطأ')); renderSync();

    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); toast(msg || 'تم الحفظ محلياً'); } catch (e) { toast('تعذر الحفظ محلياً'); }

  }
}

}

    ${list.map(r => `<tr><td class="num">${fmtHs(r.date)}<br><small style="color:var(--muted)">${r.date}</small></td><td>${fmtDay(r.date)}</td><td>${esc(staffName(r.staffId))}</td><td>${typePill(r)}</td><td>${excPill(r)}</td><td><button class="pill ${r.faris ? 'ok' : 'muted'}" style="border:0;cursor:pointer" title="اضغط للتبديل" onclick="toggleFaris('${r.id}')">${r.faris ? '✓ مسجّل' : 'غير مسجّل'}</button></td><td style="max-width:220px;font-size:.85rem;color:var(--muted)">${esc(r.note || '')}</td><td>${r.letterId ? `<a href="#letter/${r.letterId}" class="pill acc">مساءلة ${esc(letterNo(r.letterId))}</a>` : (r.excused ? '' : `<a href="#letter/new-${r.id}" class="btn sm">إصدار مساءلة</a>`)}</td><td>${deductCell(r)}</td><td class="actions"><a class="btn sm" href="#records/edit-${r.id}" title="تعديل">${I.edit}</a> <button class="btn sm danger" onclick="delRecord('${r.id}')" title="حذف">${I.trash}</button></td></tr>`).join('')}
    </tbody></table></div><p style="color:var(--muted);font-size:.85rem;margin-top:8px">${list.length} تسجيل</p>` : '<div class="empty">لا توجد تسجيلات مطابقة</div>'}
  </div>
  ${(() => { const nf = S.records.filter(r => !r.faris).sort((a, b) => a.date.localeCompare(b.date)); return `<div class="card"><h2>غياب غير مسجّل في فارس <span class="pill ${nf.length ? 'warn' : 'ok'}">${nf.length}</span></h2>
    ${nf.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>العذر</th><th>ملاحظة</th><th></th></tr></thead><tbody>${nf.map(r => `<tr><td class="num">${fmtHs(r.date)}<br><small style="color:var(--muted)">${r.date}</small></td><td><b>${esc(staffName(r.staffId))}</b></td><td>${typePill(r)}</td><td>${excPill(r)}</td><td style="font-size:.85rem;color:var(--muted)">${esc(r.note || '')}</td><td class="actions"><button class="btn sm primary" onclick="toggleFaris('${r.id}')">✓ تم تسجيله في فارس</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">كل حالات الغياب مسجّلة في فارس</div>'}
  </div>`; })()}`;
}
function monthLabel(m) { const d = parse(m + '-01'); return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { month: 'long', year: 'numeric' }).format(d); }
function letterNo(id) { const l = S.letters.find(x => x.id === id); return l ? l.no : ''; }
function staffOptions(sel, onlyActive) { return S.staff.filter(s => !onlyActive || s.active !== false).sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join(''); }

    <label class="f">التاريخ<input type="date" name="date" value="${r.date}" required max="${todayISO()}"></label>
    <label class="f">التاريخ الهجري<input value="${fmtH(r.date)}" readonly id="hijriPrev" style="background:var(--surface2)"></label>
    <div class="f full"><span style="font-size:.85rem;color:var(--muted);font-weight:500">النوع</span><div class="seg" id="typeSeg">${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-v="${k}" class="${k === r.type ? 'on' : ''}">${v}</button>`).join('')}</div></div>

    <div class="f" style="justify-content:flex-end;gap:10px"><label class="check"><input type="checkbox" name="excused" ${r.excused ? 'checked' : ''}> بعذر مقبول (لا تُصدر مساءلة)</label><label class="check"><input type="checkbox" name="faris" ${r.faris ? 'checked' : ''}> مسجّل الغياب في فارس</label></div>
    <label class="f full">ملاحظة / سبب<input name="note" value="${esc(r.note || '')}" placeholder="مثال: بدون إشعار، أو نوع العذر"></label>
    <div class="row end full"><button type="button" class="btn" onclick="closeDlg();location.hash='#records'">إلغاء</button><button class="btn primary">${id ? 'حفظ التعديل' : 'حفظ'}</button></div>
  </form>`);
  let type = r.type;
  $('#typeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.v; [...$('#typeSeg').children].forEach(x => x.classList.toggle('on', x === b)); $('#minWrap').style.display = type === 'absent' ? 'none' : ''; $('#minWrap').firstChild.textContent = type === 'early' ? 'دقائق الانصراف المبكر' : 'دقائق التأخر'; };
  $('#recForm [name=date]').oninput = e => { $('#hijriPrev').value = e.target.value ? fmtH(e.target.value) : ''; };
  $('#recForm').onsubmit = e => {

    if (!ids.length) return toast('اختر المنسوب');
    const base = { date: f.get('date'), type, excused: !!f.get('excused'), faris: !!f.get('faris'), minutes: type === 'absent' ? '' : Number(f.get('minutes') || 0) || '', note: f.get('note').trim() };
    if (id) Object.assign(r, base, { updatedAt: Date.now(), updatedBy: session.name });
    else ids.forEach(sid => { if (S.records.some(x => x.staffId === sid && x.date === base.date && x.type === base.type)) return; S.records.push({ id: uid(), staffId: sid, ...base, createdAt: Date.now(), createdBy: session.name }); });

function filterPick(q) { q = q.trim(); let n = 0; [...$('#pickList').children].forEach(l => { const show = !q || l.dataset.n.includes(q); l.style.display = show ? '' : 'none'; if (show) n++; }); }
document.addEventListener('change', e => { if (e.target.name === 'staffId' && $('#pickCount')) { const n = document.querySelectorAll('#pickList input:checked').length; $('#pickCount').textContent = n ? `تم اختيار ${n}` : ''; } });
function deductCell(r) {

  if (q.decision === 'deduct') return isAdmin() ? `<button class="btn sm primary" onclick="issueDeduction('${q.id}')">إصدار قرار حسم</button>` : '<span class="pill warn">بانتظار قرار الحسم</span>';

}
function toggleFaris(id) { const r = S.records.find(x => x.id === id); if (!r) return; r.faris = !r.faris; save(r.faris ? 'تم تعليم التسجيل كمسجّل في فارس' : 'تم إلغاء التعليم'); }
function delRecord(id) {
  const r = S.records.find(x => x.id === id); if (!r) return;
  if (r.letterId && !isAdmin()) return toast('هذا التسجيل مرتبط بمساءلة، يحذفه مدير النظام فقط');
  confirmDlg(`حذف تسجيل ${TYPES[r.type]} للمنسوب ${staffName(r.staffId)} بتاريخ ${fmtHs(r.date)}؟`, () => {

}

/* ---------- Staff ---------- */
let staffQ = '', staffSort = { key: 'name', dir: 1 };
function sortStaff(k) { if (staffSort.key === k) staffSort.dir = -staffSort.dir; else staffSort = { key: k, dir: 1 }; refreshStaffTable(); }
function renderStaff() {
  const q = staffQ.trim();
  const list = S.staff.filter(s => !q || s.name.includes(q) || (s.civil || '').includes(q) || (s.spec || '').includes(q) || (s.job || '').includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  const counts = {}; S.records.forEach(r => { counts[r.staffId] = (counts[r.staffId] || 0) + 1; });
  return `<div class="row" style="margin-bottom:14px">${isAdmin() ? `<button class="btn primary" onclick="staffForm()">${I.plus} إضافة منسوب</button><button class="btn" onclick="importStaff()">استيراد قائمة</button>` : ''}<button class="btn" onclick="exportStaffXlsx()">${I.xls} تصدير Excel</button></div>
  <div class="card">
    <div class="filters"><label class="f" style="max-width:360px">بحث<input value="${esc(staffQ)}" oninput="staffQ=this.value;refreshStaffTable()" placeholder="الاسم، الهوية، التخصص…"></label></div>
    <div id="staffTable">${staffTable(list, counts)}</div>
  </div>`;
}
function staffTable(list, counts) {
  const { key, dir } = staffSort;
  const val = s => key === 'count' ? (counts[s.id] || 0) : (s[key] || s.field || '');
  list = [...list].sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'ar')) * dir || a.name.localeCompare(b.name, 'ar'); });
  const th = (k, label) => `<th class="sortable ${key === k ? 'on' : ''}" onclick="sortStaff('${k}')">${label} <span class="arr">${key === k ? (dir === 1 ? '▲' : '▼') : '⇅'}</span></th>`;
  return list.length ? `<div class="tw"><table><thead><tr><th>#</th>${th('name', 'الاسم')}${th('job', 'الوظيفة')}${th('spec', 'التخصص')}<th>المستوى / الدرجة</th><th>الجوال</th><th>الحالة</th>${th('count', 'التسجيلات')}<th></th></tr></thead><tbody>
  ${list.map((s, i) => `<tr style="${s.active === false ? 'opacity:.55' : ''}"><td class="num">${i + 1}</td><td><b>${esc(s.name)}</b>${s.civil ? `<br><small class="num" style="color:var(--muted)">${esc(s.civil)}</small>` : ''}</td><td>${esc(s.job || '')}</td><td>${esc(s.spec || s.field || '')}</td><td class="num">${esc([s.level, s.grade].filter(Boolean).join(' / ') || '—')}</td><td class="num" dir="ltr" style="text-align:right">${esc(s.phone || '')}</td><td>${s.active === false ? '<span class="pill muted">منقول / غير نشط</span>' : '<span class="pill ok">على رأس العمل</span>'}</td><td class="num">${counts[s.id] || 0}</td><td class="actions">${isAdmin() ? `<button class="btn sm" onclick="staffForm('${s.id}')">${I.edit}</button> <button class="btn sm danger" onclick="delStaff('${s.id}')">${I.trash}</button>` : ''}</td></tr>`).join('')}
  </tbody></table></div><p style="color:var(--muted);font-size:.85rem;margin-top:8px">${list.length} منسوب</p>` : '<div class="empty">لا يوجد منسوبون. أضف منسوباً أو استورد قائمة.</div>';
}
function refreshStaffTable() { const q = staffQ.trim(); const counts = {}; S.records.forEach(r => { counts[r.staffId] = (counts[r.staffId] || 0) + 1; }); $('#staffTable').innerHTML = staffTable(S.staff.filter(s => !q || s.name.includes(q) || (s.civil || '').includes(q) || (s.spec || '').includes(q) || (s.job || '').includes(q)).sort((a, b) => a.name.localeCompare(b.name, 'ar')), counts); }
function staffForm(id) {
  const s = id ? S.staff.find(x => x.id === id) : { name: '', job: 'معلم', spec: '', civil: '', phone: '', active: true };
  openDlg(`<h2>${id ? 'تعديل بيانات منسوب' : 'إضافة منسوب'}</h2><form id="sf" class="form">
    <label class="f full">الاسم الرباعي<input name="name" value="${esc(s.name)}" required></label>
    <label class="f">الوظيفة<input name="job" value="${esc(s.job)}" list="jobs"><datalist id="jobs"><option>معلم</option><option>إداري</option><option>وكيل</option><option>مرشد طلابي</option><option>أمين مصادر</option><option>محضر مختبر</option><option>مساعد إداري</option><option>حارس</option><option>عامل</option></datalist></label>
    <label class="f">التخصص<input name="spec" value="${esc(s.spec || '')}"></label>
    <label class="f">رقم الهوية الوطنية<input name="civil" value="${esc(s.civil || '')}" inputmode="numeric"></label>
    <label class="f">الجوال<input name="phone" value="${esc(s.phone || '')}" inputmode="tel"></label>
    <label class="f">المستوى / المرتبة<input name="level" value="${esc(s.level || '')}"></label>
    <label class="f">الدرجة<input name="grade" value="${esc(s.grade || '')}"></label>
    <label class="f">رقم الوظيفة<input name="jobNo" value="${esc(s.jobNo || '')}" inputmode="numeric"></label>
    <label class="check f full"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}> على رأس العمل</label>
    <div class="row end full"><button type="button" class="btn" onclick="closeDlg()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`);
  $('#sf').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); const d = {}; ['name', 'job', 'spec', 'civil', 'phone', 'level', 'grade', 'jobNo'].forEach(k => d[k] = (f.get(k) || '').trim()); d.active = !!f.get('active'); if (id) Object.assign(s, d); else S.staff.push({ id: uid(), ...d }); closeDlg(); save(); };
}
function delStaff(id) {
  const n = S.records.filter(r => r.staffId === id).length;
  confirmDlg(`حذف ${staffName(id)}${n ? ` مع ${n} تسجيل مرتبط به` : ''}؟ (يفضّل تعيينه "غير نشط" بدلاً من الحذف)`, () => { S.staff = S.staff.filter(s => s.id !== id); S.records = S.records.filter(r => r.staffId !== id); S.letters = S.letters.filter(l => l.staffId !== id); save('تم الحذف'); });

function importStaff() {
  openDlg(`<h2>استيراد قائمة منسوبين</h2><p style="color:var(--muted);font-size:.88rem;margin-bottom:8px">الصق الأسماء، كل سطر منسوب. يمكن فصل الأعمدة بعلامة تبويب أو فاصلة: <b>الاسم، الوظيفة، التخصص، الهوية، الجوال، المستوى/المرتبة، الدرجة، رقم الوظيفة</b> (من Excel: انسخ الأعمدة والصقها هنا).</p>
  <form id="imf" class="form"><label class="f full"><textarea name="t" rows="10" dir="auto" placeholder="محمد أحمد العتيبي	معلم	رياضيات	10xxxxxxxx	05xxxxxxxx"></textarea></label>

  $('#imf').onsubmit = e => {

      S.staff.push({ id: uid(), name: c[0], job: c[1] || 'معلم', spec: c[2] || '', civil: c[3] || '', phone: c[4] || '', level: c[5] || '', grade: c[6] || '', jobNo: c[7] || '', active: true }); n++;

}

/* ---------- Letters (مساءلة غياب + قرار حسم غياب) ---------- */
const KINDS = { inquiry: 'مساءلة غياب', deduction: 'قرار حسم غياب' };
const DECISIONS = { '': 'لم يُبتّ بعد', sick: 'تحتسب له إجازة مرضية وتُرفع بنظام فارس', emergency: 'يحتسب غيابه من رصيد الإجازات الاضطرارية لقبول عذره', deduct: 'يعتمد الحسم لعدم قبول عذره' };
let letFilter = { status: '', month: '', kind: '' };
const lKind = l => l.kind || 'inquiry';
function renderLetters() {
  const pending = S.records.filter(r => !r.excused && !r.letterId).sort((a, b) => b.date.localeCompare(a.date));
  const months = [...new Set(S.letters.map(l => monthKey(l.date)))].sort().reverse();
  const list = S.letters.filter(l => (!letFilter.status || l.status === letFilter.status) && (!letFilter.month || monthKey(l.date) === letFilter.month) && (!letFilter.kind || lKind(l) === letFilter.kind)).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const pendingByStaff = {}; pending.forEach(r => (pendingByStaff[r.staffId] = pendingByStaff[r.staffId] || []).push(r));
  const awaiting = S.letters.filter(l => lKind(l) === 'inquiry' && l.decision === 'deduct' && !S.letters.some(x => x.inquiryId === l.id));
  return `
  <div class="card"><h2>حالات بدون عذر لم تصدر لها مساءلة <span class="pill warn">${pending.length}</span>${pending.length ? `<button class="btn primary sm" onclick="issueAllPending()">${I.letter} إصدار مساءلة لكل منسوب (${Object.keys(pendingByStaff).length})</button>` : ''}</h2>
    ${pending.length ? `<div class="tw"><table><thead><tr><th>الاسم</th><th>الحالات</th><th></th></tr></thead><tbody>${Object.entries(pendingByStaff).map(([sid, rs]) => `<tr><td><b>${esc(staffName(sid))}</b></td><td>${rs.map(r => `<span class="pill ${r.type}">${TYPES[r.type]} ${fmtHs(r.date)}</span>`).join(' ')}</td><td class="actions"><a class="btn sm primary" href="#letter/new-${rs.map(r => r.id).join('.')}">إصدار مساءلة</a></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد حالات معلّقة</div>'}
  </div>
  ${awaiting.length ? `<div class="card"><h2>مساءلات اعتُمد فيها الحسم ولم يصدر قرار <span class="pill absent">${awaiting.length}</span></h2><div class="tw"><table><thead><tr><th>المساءلة</th><th>الاسم</th><th>أيام الغياب</th><th></th></tr></thead><tbody>${awaiting.map(l => `<tr><td class="num">${esc(l.no)}</td><td>${esc(staffName(l.staffId))}</td><td class="num">${absentDays(l)}</td><td class="actions"><button class="btn sm primary" onclick="issueDeduction('${l.id}')">إصدار قرار حسم</button></td></tr>`).join('')}</tbody></table></div></div>` : ''}
  <div class="card"><h2>الخطابات الصادرة <span class="pill acc">${S.letters.length}</span>${list.length ? `<button class="btn sm" onclick="printLetters(${JSON.stringify(list.map(l => l.id)).replace(/"/g, '&quot;')})">${I.print} طباعة المعروض (${list.length})</button>` : ''}</h2>
    <div class="filters">
      <label class="f">النوع<select onchange="letFilter.kind=this.value;route()"><option value="">الكل</option>${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${k === letFilter.kind ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="f">الحالة<select onchange="letFilter.status=this.value;route()"><option value="">الكل</option>${Object.entries(LSTATUS).map(([k, v]) => `<option value="${k}" ${k === letFilter.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label>

async function fbInit() {

  FB.app = firebase.initializeApp(FB_CONFIG); FB.auth = firebase.auth(); FB.db = firebase.database();
  await FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

  let prof = null;
  try { prof = (await FB.db.ref('users/' + user.uid).once('value')).val(); } catch (e) { prof = null; }
  if (!prof || prof.disabled) { await FB.auth.signOut(); session = null; toast(prof ? 'هذا الحساب معطّل' : 'الحساب غير مفعّل، تواصل مع مدير النظام'); return; }
  session = { id: user.uid, name: prof.name, role: prof.role, username: prof.username };
  await fbAttach();
}
function fbDetach() { if (FB.unsub) { FB.db.ref('data/state').off('value', FB.unsub); FB.unsub = null; } FB.loaded = false; }
function fbAttach() {
  return new Promise(res => {
    FB.unsub = snap => {
      const v = snap.val();
      if (v && v.v) { S = v; for (const k of Object.keys(DEFAULT)) if (S[k] === undefined) S[k] = structuredClone(DEFAULT[k]); ['staff', 'records', 'letters', 'users'].forEach(k => { if (!Array.isArray(S[k])) S[k] = Object.values(S[k] || {}); }); }
      const wasLoaded = FB.loaded; FB.loaded = true;
      if (!wasLoaded) res();
      else if (!$('#dlg').open && !FB.selfWrite) { route(); toast('تم تحديث البيانات'); }
      FB.selfWrite = false;
    };
    FB.db.ref('data/state').on('value', FB.unsub, err => { toast('تعذر تحميل البيانات: ' + fbMsg(err)); FB.loaded = true; res(); });
  });
}
async function fbSave(msg) {
  renderSync('busy');
  try { FB.selfWrite = true; await FB.db.ref('data/state').set(JSON.parse(JSON.stringify(S))); toast(msg || 'تم الحفظ'); }
  catch (e) { FB.selfWrite = false; toast('تعذر الحفظ: ' + fbMsg(e)); }
  renderSync(); route();
}
function fbRenderLogin(setup) {
  $('#root').innerHTML = `<div class="login"><div class="card">
    <h1>${setup ? 'إنشاء حساب مدير النظام' : 'سجل غياب منسوبي المدرسة'}</h1>
    <p class="sub">${setup ? 'يُنشأ هذا الحساب مرة واحدة فقط عند أول تشغيل.' : esc(S.settings.school)}</p>
    <form id="loginForm" class="form">
      ${setup ? `<label class="f full">اسم المدير<input name="name" required autocomplete="name"></label>` : ''}
      <label class="f full">اسم المستخدم<input name="username" required autocomplete="username" dir="ltr" style="text-align:right" pattern="[A-Za-z0-9._-]+" title="حروف إنجليزية وأرقام فقط"></label>
      <label class="f full">كلمة المرور<input name="password" type="password" required minlength="6" autocomplete="${setup ? 'new-password' : 'current-password'}"></label>
      <div class="error full" id="loginErr"></div>
      <button class="btn primary full" style="justify-content:center" id="loginBtn">${setup ? 'إنشاء الحساب والدخول' : 'دخول'}</button>
    </form>
    <p class="sub" style="margin:14px 0 0;font-size:.8rem"><span class="sync" id="syncBadge"></span></p>
    <p style="margin-top:10px;font-size:.8rem"><a href="#" onclick="fbRenderLogin(${!setup});return false">${setup ? 'لديك حساب؟ تسجيل الدخول' : 'أول تشغيل؟ إنشاء حساب مدير النظام'}</a></p>
  </div></div>`;
  renderSync();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault(); const btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
    const f = new FormData(e.target), u = f.get('username').trim(), p = f.get('password');
    try {
      if (setup) {
        const cred = await FB.auth.createUserWithEmailAndPassword(fbEmail(u), p);
        try { await FB.db.ref('users/' + cred.user.uid).set({ name: f.get('name').trim(), username: u, role: 'admin', createdAt: Date.now() }); }
        catch (err) { await cred.user.delete().catch(() => {}); throw new Error('يوجد مدير نظام مسبقاً. اطلب منه إضافة حسابك من الإعدادات.'); }
        await fbAfterLogin(cred.user);
        if (session && !S.records.length && !S.staff.length) await FB.db.ref('data/state').set(JSON.parse(JSON.stringify(S))).catch(() => {});
      } else {
        const cred = await FB.auth.signInWithEmailAndPassword(fbEmail(u), p);
        await fbAfterLogin(cred.user);
      }
      if (session) { location.hash = '#dashboard'; route(); }
    } catch (err) { $('#loginErr').textContent = fbMsg(err); }
    btn.disabled = false;
  };
}
async function fbLoadUsers() { try { FB.users = (await FB.db.ref('users').once('value')).val() || {}; } catch (e) { FB.users = {}; } }
function fbUsersCard() {
  const rows = Object.entries(FB.users).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'ar'));
  return `<div class="card"><h2>المستخدمون <button class="btn sm primary" onclick="fbUserForm()">${I.plus} إضافة مستخدم</button></h2>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(([uid, u]) => `<tr style="${u.disabled ? 'opacity:.55' : ''}"><td>${esc(u.name)}</td><td dir="ltr" style="text-align:right">${esc(u.username)}</td><td><span class="pill ${u.role === 'admin' ? 'acc' : 'muted'}">${u.role === 'admin' ? 'مدير النظام' : 'مسجّل بيانات'}</span></td><td>${u.disabled ? '<span class="pill absent">معطّل</span>' : '<span class="pill ok">نشط</span>'}</td><td class="actions"><button class="btn sm" onclick="fbUserForm('${uid}')">${I.edit}</button> ${uid !== session.id ? `<button class="btn sm ${u.disabled ? '' : 'danger'}" onclick="fbToggleUser('${uid}')">${u.disabled ? 'تفعيل' : 'تعطيل'}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
    <p style="color:var(--muted);font-size:.85rem;margin-top:10px">مدير النظام: كل الصلاحيات. مسجّل البيانات: تسجيل الغياب وإصدار المساءلات وطباعتها فقط.<br>كل مستخدم يغيّر كلمة مروره بنفسه من هنا بعد الدخول. لإعادة تعيين كلمة مرور مستخدم نسيها: من لوحة Firebase ← Authentication ← Users.</p>
  </div>`;
}
function fbUserForm(uid) {
  const u = uid ? FB.users[uid] : { name: '', username: '', role: 'entry' }; const self = uid === session.id;
  openDlg(`<h2>${uid ? 'تعديل مستخدم' : 'إضافة مستخدم'}</h2><form id="uf" class="form">
    <label class="f full">الاسم<input name="name" value="${esc(u.name)}" required></label>
    <label class="f">اسم المستخدم<input name="username" value="${esc(u.username)}" ${uid ? 'readonly style="background:var(--surface2)"' : 'required pattern="[A-Za-z0-9._-]+" title="حروف إنجليزية وأرقام فقط"'} dir="ltr" style="text-align:right"></label>
    <label class="f">الصلاحية<select name="role" ${self ? 'disabled' : ''}><option value="entry" ${u.role === 'entry' ? 'selected' : ''}>مسجّل بيانات</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>مدير النظام</option></select></label>
    ${!uid || self ? `<label class="f full">${uid ? 'كلمة مرور جديدة (اتركها فارغة للإبقاء على الحالية)' : 'كلمة المرور (6 أحرف على الأقل)'}<input name="password" type="password" ${uid ? '' : 'required minlength="6"'} autocomplete="new-password"></label>` : '<p class="full" style="font-size:.82rem;color:var(--muted)">كلمة المرور يغيّرها صاحب الحساب بنفسه، أو تُعاد من لوحة Firebase.</p>'}
    <div class="row end full"><button type="button" class="btn" onclick="closeDlg()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`);
  $('#uf').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const p = f.get('password') || '';
    const d = { name: f.get('name').trim(), username: (f.get('username') || u.username).trim(), role: self ? u.role : f.get('role') };
    try {
      if (uid) {
        await FB.db.ref('users/' + uid).update(d);
        if (self && p) await FB.auth.currentUser.updatePassword(p);
        if (self) session.name = d.name;
      } else {
        const sec = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(FB_CONFIG, 'sec');
        const cred = await sec.auth().createUserWithEmailAndPassword(fbEmail(d.username), p);
        await FB.db.ref('users/' + cred.user.uid).set({ ...d, createdAt: Date.now(), createdBy: session.name });
        await sec.auth().signOut();
      }
      closeDlg(); await fbLoadUsers(); toast('تم حفظ المستخدم'); route();
    } catch (err) { toast(fbMsg(err)); }
  };
}
async function fbToggleUser(uid) { const u = FB.users[uid]; try { await FB.db.ref('users/' + uid).update({ disabled: !u.disabled }); await fbLoadUsers(); route(); } catch (e) { toast(fbMsg(e)); } }

/* ---------- Boot ---------- */
if (FB_CONFIG) { $('#root').innerHTML = '<div class="login"><div class="card" style="text-align:center"><h1>سجل غياب منسوبي المدرسة</h1><p class="sub" style="margin-top:8px">جارٍ الاتصال بقاعدة البيانات…</p></div></div>'; capReady.then(() => route()); }
else route();
try { const p = sessionStorage.getItem('absence-print'); if (p && session) { sessionStorage.removeItem('absence-print'); setTimeout(() => printLetters(JSON.parse(p)), 600); } } catch (e) {}

</script>
</body>
</html>
