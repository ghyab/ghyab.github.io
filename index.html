<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img,svg{max-width:100%}</style>
<title>سجل غياب منسوبي المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E9EFED; --line:#D3DDD9; --text:#182A31; --muted:#5C6F76;
  --accent:#0F766E; --accent-ink:#0A5B55; --accent-soft:#D9F0EC; --on-accent:#FFFFFF;
  --absent:#B3261E; --absent-soft:#FBE4E2; --late:#A85F00; --late-soft:#FCEBD1; --early:#5747A6; --early-soft:#E7E3F7; --ok:#1E7A46; --ok-soft:#DDF2E5;
  --shadow:0 1px 2px rgba(23,42,49,.06),0 6px 20px rgba(23,42,49,.06);
  --radius:10px; --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif; --letter:"Amiri","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1A1E; --surface:#16252B; --surface2:#1E3038; --line:#2B3F47; --text:#E4EDEF; --muted:#9AB0B7;
  --accent:#34C9B8; --accent-ink:#8FE3D8; --accent-soft:#163B3A; --on-accent:#08201E;
  --absent:#F08C84; --absent-soft:#3C1E1B; --late:#F0B45A; --late-soft:#3B2B12; --early:#B8ACF2; --early-soft:#2A2445; --ok:#6FD394; --ok-soft:#173526;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --surface:#16252B; --surface2:#1E3038; --line:#2B3F47; --text:#E4EDEF; --muted:#9AB0B7;
  --accent:#34C9B8; --accent-ink:#8FE3D8; --accent-soft:#163B3A; --on-accent:#08201E;
  --absent:#F08C84; --absent-soft:#3C1E1B; --late:#F0B45A; --late-soft:#3B2B12; --early:#B8ACF2; --early-soft:#2A2445; --ok:#6FD394; --ok-soft:#173526;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.3}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-inline-start:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{display:block;font-size:1.05rem}
.brand small{color:var(--muted);display:block;font-size:.8rem;line-height:1.4}
nav a.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:500;cursor:pointer}
nav a.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a.nav.active{background:var(--accent-soft);color:var(--accent-ink)}
nav a.nav:hover:not(.active){background:var(--surface2)}
.side-foot{margin-top:auto;font-size:.82rem;color:var(--muted);padding:8px}
.side-foot b{color:var(--text);display:block}
main{padding:22px clamp(14px,3vw,36px) 90px;max-width:1100px;width:100%;min-width:0}
#app>*,.grid2>*,.card{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}.sync.busy i{background:var(--late);animation:pulse 1s infinite}.sync.off i{background:var(--absent)}
@keyframes pulse{50%{opacity:.3}}

/* Cards, grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card h2{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-inline-start:4px solid var(--accent)}
.stat.absent{border-inline-start-color:var(--absent)}.stat.late{border-inline-start-color:var(--late)}.stat.early{border-inline-start-color:var(--early)}.stat.ok{border-inline-start-color:var(--ok)}
.stat .v{font-size:1.7rem;font-weight:600;line-height:1.2}
.stat .l{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}

/* Forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
.f>input,.f>select,.f>textarea{color:var(--text)}
.f>input,.f>select,.f>textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:.95rem}
label.f>input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px;border:0;background:var(--surface);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.seg button.on[data-v="absent"]{background:var(--absent-soft);color:var(--absent)}
.seg button.on[data-v="late"]{background:var(--late-soft);color:var(--late)}
.seg button.on[data-v="early"]{background:var(--early-soft);color:var(--early)}
.check{display:flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--absent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters label.f{min-width:140px;flex:1}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--surface2)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}th.sortable.on{color:var(--accent-ink)}th.sortable .arr{font-size:.7rem;opacity:.6}th.sortable.on .arr{opacity:1}
tr:hover td{background:color-mix(in srgb,var(--surface2) 50%,transparent)}
td.actions{white-space:nowrap;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.92rem}

.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.absent{background:var(--absent-soft);color:var(--absent)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.early{background:var(--early-soft);color:var(--early)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--late-soft);color:var(--late)}
.pill.muted{background:var(--surface2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.login .card{width:min(420px,100%)}
.login h1{margin-bottom:4px}
.login .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
.error{color:var(--absent);font-size:.88rem;margin-top:6px}

/* Toast, dialog */
.toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--text);width:min(560px,94vw);box-shadow:var(--shadow);direction:rtl}
dialog::backdrop{background:rgba(10,20,25,.5)}
dialog .dl{padding:20px}
dialog h2{margin-bottom:14px}
.dl .row.end{margin-top:16px}

/* Bottom nav on mobile */
.bnav{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:14px 14px 90px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);text-decoration:none;padding:4px 0;cursor:pointer}
  .bnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav a.active{color:var(--accent)}
  .stat .v{font-size:1.4rem}
  th,td{padding:8px 7px}
}

/* Letter (screen preview + print) */
.letter{font-family:var(--letter);color:#000;background:#fff;width:210mm;min-height:296mm;padding:12mm 16mm 12mm;margin:0 auto;font-size:13.5pt;line-height:1.7;position:relative;page-break-after:always;break-after:page}
.letter:last-child{page-break-after:auto;break-after:auto}
.letter .head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;font-size:12.5pt;line-height:1.45;margin-bottom:4mm}
.letter .head .r{text-align:right;justify-self:start;font-weight:700;white-space:nowrap}.letter .head .r small{font-weight:400;font-size:11pt;display:block}.letter .head .l{font-size:11pt;display:grid;grid-template-columns:max-content max-content;gap:0 3mm;align-content:start;justify-content:start;justify-self:end;direction:rtl;text-align:right}
.letter .head .logo{width:36mm;height:auto;display:block;margin:0 auto}
.letter .head .logo-ph{width:22mm;height:22mm;border:1px dashed #999;border-radius:50%;display:grid;place-items:center;font-size:9pt;color:#777;margin:0 auto}
.letter .title{text-align:center;font-size:18pt;font-weight:700;margin:2mm 0 3mm;display:flex;justify-content:center;align-items:baseline;gap:10mm;flex-wrap:wrap}
.letter .title small{font-size:10.5pt;font-weight:400}
.letter table.info{width:100%;border-collapse:collapse;font-size:12pt;margin-bottom:4mm}
.letter table.info th,.letter table.info td{border:1px solid #000;padding:1.2mm 2.5mm;text-align:center;line-height:1.5}
.letter table.info th{background:#e8e8e8;font-weight:700;width:28mm;letter-spacing:0;color:#000}
.letter .digits{display:flex;gap:1.5mm;justify-content:flex-start;direction:ltr;padding:1mm 0}
.letter .digits span{width:7.5mm;height:8mm;border:1px solid #000;display:grid;place-items:center;font-size:12pt}
.letter .to{display:flex;justify-content:space-between;gap:16px}
.letter .body{text-align:justify}
.letter .body ul{margin:1mm 0;padding-inline-start:7mm}
.letter .sig{display:flex;justify-content:space-between;gap:10mm;margin-top:2mm}
.letter .sig>div{white-space:nowrap}
.letter hr{border:0;border-top:1.5px solid #000;margin:4mm 0}
.letter .dl{color:#9a9a9a;letter-spacing:.5px}
.letter .dots{border-bottom:1px dotted #333;height:8mm}
.letter .opts div{display:flex;gap:3mm;align-items:baseline}
.letter .opts i{width:5mm;height:5mm;border:1.5px solid #000;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-style:normal;font-size:10pt;transform:translateY(1mm)}
.letter .opts i.on::after{content:'';width:3mm;height:3mm;background:#000;border-radius:50%}
.letter .note{font-size:11pt;margin-top:3mm}
.letter .foot{position:absolute;bottom:6mm;inset-inline:16mm;font-size:9pt;color:#666;display:flex;justify-content:space-between}
#printArea{display:none}
#printArea.rendering{display:block;position:absolute;top:0;left:-3000px;width:210mm;z-index:-1}
#printArea.rendering .letter{margin:0}
.preview{background:#8a9497;padding:16px;overflow:auto;border-radius:var(--radius)}
.preview .letter{box-shadow:0 4px 20px rgba(0,0,0,.35)}
.picklist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.picklist label{padding:4px 0;border-bottom:1px solid var(--line)}.picklist label:last-child{border:0}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app,.toast,.bnav,dialog{display:none!important}
  #printArea{display:block}
  .letter{box-shadow:none;margin:0;width:210mm;height:296mm;zoom:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<script>

'use strict';

const P_STATE = '__' + 'STATE__', P_TPL = '__' + 'TPL__';

const DEFAULT = {

const staffById = id => S.staff.find(s => s.id === id);
const staffName = id => staffById(id)?.name || '—';

/* ---------- Dates ---------- */
const hijriFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
const hijriShort = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' });
const gregFmt = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
const dayFmt = new Intl.DateTimeFormat('ar-SA-u-nu-latn', { weekday: 'long' });
const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtH = iso => iso ? hijriFmt.format(parse(iso)) : '';
const fmtHs = iso => iso ? hijriShort.format(parse(iso)).replace(/\s*هـ$/, '') : '';
const fmtG = iso => iso ? gregFmt.format(parse(iso)) : '';
const fmtDay = iso => iso ? dayFmt.format(parse(iso)) : '';
const monthKey = iso => iso.slice(0, 7);

/* ---------- Persistence (cloud via artifact capability, else local) ---------- */
let artifactNS = null, capResolved = false, mode = 'connecting';
const LS_KEY = 'absence-app-state';
const capReady = (async () => {
  await Promise.resolve();
  try { if (window.claude && window.claude.use) artifactNS = await window.claude.use('artifact'); } catch (e) { artifactNS = null; }
  capResolved = true;
  if (artifactNS) { mode = 'cloud'; }
  else {
    mode = 'local';
    try { const l = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (l && l.v && (l.updatedAt || 0) > (S.updatedAt || 0)) { S = l; } } catch (e) {}
  }
  renderSync(); if (session) route();
})();

function buildHTML(state) {
  const tplB64 = $('#tpl').textContent.trim();
  const tpl = new TextDecoder().decode(Uint8Array.from(atob(tplB64), c => c.charCodeAt(0)));
  const json = JSON.stringify(state).replace(/<\//g, '<\\/');
  return tpl.replace(P_TPL, tplB64).replace(P_STATE, json);
}
let saving = false;
async function save(msg) {
  S.updatedAt = Date.now();
  await capReady;
  if (mode === 'cloud') {
    if (saving) return;
    saving = true; renderSync('busy');
    try {
      sessionStorage.setItem('absence-view', location.hash || '#dashboard');
      await artifactNS.publish(buildHTML(S));
      toast(msg || 'تم الحفظ');
    } catch (e) {
      saving = false;
      const code = e && e.code;
      if (code === 'conflict') { toast('تم تحديث البيانات من جهاز آخر، جارٍ إعادة التحميل…'); return; }
      if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required') { mode = 'readonly'; renderSync(); toast('هذه النسخة للعرض فقط — لا يمكن الحفظ'); return; }
      if (code === 'rate_limited') { toast('محاولات حفظ كثيرة، انتظر قليلاً ثم أعد المحاولة'); renderSync(); return; }
      if (code === 'too_large') { toast('حجم البيانات كبير جداً (قلّل حجم الشعار)'); renderSync(); return; }
      toast('تعذر الحفظ: ' + (e.message || code || 'خطأ')); renderSync();
    }
  } else {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); toast(msg || 'تم الحفظ محلياً'); } catch (e) { toast('تعذر الحفظ محلياً'); }
    route();
  }
}
function renderSync(force) {
  const el = $('#syncBadge'); if (!el) return;
  const m = force || mode;
  const map = { connecting: ['', 'جارٍ الاتصال…'], cloud: ['on', 'متصل — الحفظ سحابي'], busy: ['busy', 'جارٍ الحفظ…'], local: ['off', 'وضع محلي — البيانات على هذا الجهاز فقط'], readonly: ['off', 'عرض فقط'] };
  el.className = 'sync ' + map[m][0]; el.innerHTML = '<i></i>' + map[m][1];
}

/* ---------- Auth ---------- */
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

const isAdmin = () => session && session.role === 'admin';

};
const NAV = [['dashboard', 'الرئيسية', I.home], ['records', 'سجل الغياب', I.log], ['staff', 'المنسوبون', I.people], ['letters', 'المساءلات', I.letter], ['reports', 'التقارير', I.chart], ['settings', 'الإعدادات', I.gear]];

/* ---------- Routing ---------- */
function route() {
  if (!session) return renderLogin();
  let view = (location.hash || sessionStorage.getItem('absence-view') || '#dashboard').replace('#', '');
  sessionStorage.removeItem('absence-view');
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  const [name, arg] = view.split('/');
  const R = { dashboard: renderDashboard, records: renderRecords, staff: renderStaff, letters: renderLetters, reports: renderReports, settings: renderSettings, letter: renderLetterEditor };
  const fn = R[name] || renderDashboard;
  shell(name, fn(arg));
  renderSync();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function shell(active, content) {
  const navHtml = NAV.filter(n => n[0] !== 'settings' || isAdmin()).map(n => `<a class="nav ${active === n[0] || (active === 'letter' && n[0] === 'letters') ? 'active' : ''}" href="#${n[0]}">${n[2]}<span>${n[1]}</span></a>`).join('');
  $('#root').innerHTML = `<div id="app">
    <aside>
      <div class="brand"><b>سجل الغياب</b><small>${esc(S.settings.school || 'المدرسة')}</small></div>
      <nav>${navHtml}</nav>
      <div class="side-foot"><b>${esc(session.name)}</b>${session.role === 'admin' ? 'مدير النظام' : 'مسجّل بيانات'}<br><a href="#" onclick="logout();return false">تسجيل الخروج</a></div>
    </aside>
    <main>
      <div class="topbar"><h1 id="pageTitle"></h1><div class="actions"><span class="sync" id="syncBadge"></span></div></div>
      <div id="content">${content}</div>
    </main>
    <div class="bnav">${navHtml.replace(/class="nav /g, 'class="')}</div>
  </div>`;
  $('#pageTitle').textContent = (NAV.find(n => n[0] === active) || ['', active === 'letter' ? 'مساءلة' : ''])[1];
}
function logout() { session = null; sessionStorage.removeItem('absence-session'); location.hash = ''; route(); }

/* ---------- Login / setup ---------- */
function renderLogin() {
  const setup = S.users.length === 0;
  $('#root').innerHTML = `<div class="login"><div class="card">
    <h1>${setup ? 'إعداد التطبيق لأول مرة' : 'سجل غياب منسوبي المدرسة'}</h1>
    <p class="sub">${setup ? 'أنشئ حساب مدير النظام. يمكنك لاحقاً إضافة مستخدمين آخرين من الإعدادات.' : esc(S.settings.school)}</p>
    <form id="loginForm" class="form">
      ${setup ? `<label class="f full">اسم المدير<input name="name" required autocomplete="name"></label>` : ''}
      <label class="f full">اسم المستخدم<input name="username" required autocomplete="username" dir="ltr" style="text-align:right"></label>
      <label class="f full">كلمة المرور<input name="password" type="password" required autocomplete="${setup ? 'new-password' : 'current-password'}"></label>
      <div class="error full" id="loginErr"></div>
      <button class="btn primary full" style="justify-content:center">${setup ? 'إنشاء الحساب والدخول' : 'دخول'}</button>
    </form>
    <p class="sub" style="margin:14px 0 0;font-size:.8rem"><span class="sync" id="syncBadge"></span></p>
  </div></div>`;
  renderSync();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), u = f.get('username').trim(), p = f.get('password');
    const h = await sha(u.toLowerCase() + ':' + p);
    if (setup) {
      if (p.length < 4) return $('#loginErr').textContent = 'كلمة المرور قصيرة';
      const user = { id: uid(), name: f.get('name').trim(), username: u, hash: h, role: 'admin' };
      S.users.push(user); setSession(user); await save('تم إنشاء حساب المدير'); return;
    }
    const user = S.users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.hash === h);
    if (!user) return $('#loginErr').textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    setSession(user); route();
  };
}
function setSession(u) { session = { id: u.id, name: u.name, role: u.role }; sessionStorage.setItem('absence-session', JSON.stringify(session)); }

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const mk = todayISO().slice(0, 7);
  const recs = S.records.filter(r => monthKey(r.date) === mk);
  const cnt = t => recs.filter(r => r.type === t).length;
  const unex = recs.filter(r => !r.excused).length;
  const pendingLetters = S.records.filter(r => !r.excused && !r.letterId).length;
  const byStaff = {};
  S.records.filter(r => !r.excused).forEach(r => { byStaff[r.staffId] = (byStaff[r.staffId] || 0) + 1; });
  const top = Object.entries(byStaff).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const recent = [...S.records].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 8);
  return `
  <div class="row" style="margin-bottom:14px"><a class="btn primary" href="#records/new">${I.plus} تسجيل غياب / تأخر</a><a class="btn" href="#letters">${I.letter} المساءلات ${pendingLetters ? `<span class="pill warn">${pendingLetters} بانتظار مساءلة</span>` : ''}</a></div>
  <div class="stats">
    <div class="stat absent"><div class="v num">${cnt('absent')}</div><div class="l">غياب هذا الشهر</div></div>
    <div class="stat late"><div class="v num">${cnt('late')}</div><div class="l">تأخر صباحي</div></div>
    <div class="stat early"><div class="v num">${cnt('early')}</div><div class="l">انصراف مبكر</div></div>
    <div class="stat"><div class="v num">${unex}</div><div class="l">حالات بدون عذر</div></div>
    <div class="stat late"><div class="v num">${S.records.filter(r => !r.faris).length}</div><div class="l">لم تُسجّل في فارس بعد</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>آخر التسجيلات</h2>${recent.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>العذر</th></tr></thead><tbody>${recent.map(r => `<tr><td class="num">${fmtHs(r.date)}</td><td>${esc(staffName(r.staffId))}</td><td>${typePill(r)}</td><td>${excPill(r)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد تسجيلات بعد</div>'}</div>
    <div class="card"><h2>الأكثر غياباً بدون عذر <small style="color:var(--muted);font-weight:400">(كامل العام)</small></h2>${top.length ? `<div class="tw"><table><thead><tr><th>الاسم</th><th>الحالات</th><th>مساءلات</th></tr></thead><tbody>${top.map(([id, n]) => `<tr><td>${esc(staffName(id))}</td><td class="num">${n}</td><td class="num">${S.letters.filter(l => l.staffId === id).length}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد حالات بدون عذر</div>'}</div>
  </div>`;
}
const typePill = r => `<span class="pill ${r.type}">${TYPES[r.type]}${r.type === 'late' && r.minutes ? ` · ${r.minutes} د` : ''}</span>`;
const excPill = r => r.excused ? '<span class="pill ok">بعذر</span>' : '<span class="pill absent">بدون عذر</span>';

/* ---------- Records ---------- */
let recFilter = { month: todayISO().slice(0, 7), staff: '', type: '', exc: '', faris: '' };
function renderRecords(arg) {
  if (arg === 'new' || (arg && arg.startsWith('edit-'))) setTimeout(() => recordForm(arg === 'new' ? null : arg.slice(5)), 0);
  const months = [...new Set(S.records.map(r => monthKey(r.date)))].sort().reverse();
  if (recFilter.month && !months.includes(recFilter.month)) months.unshift(recFilter.month);
  let list = S.records.filter(r => (!recFilter.month || monthKey(r.date) === recFilter.month) && (!recFilter.staff || r.staffId === recFilter.staff) && (!recFilter.type || r.type === recFilter.type) && (!recFilter.exc || (recFilter.exc === 'y') === !!r.excused) && (!recFilter.faris || (recFilter.faris === 'y') === !!r.faris));
  list.sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="row" style="margin-bottom:14px"><a class="btn primary" href="#records/new">${I.plus} تسجيل جديد</a></div>
  <div class="card">
    <div class="filters">
      <label class="f">الشهر<select onchange="recFilter.month=this.value;route()"><option value="">كل الأشهر</option>${months.map(m => `<option value="${m}" ${m === recFilter.month ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select></label>
      <label class="f">المنسوب<select onchange="recFilter.staff=this.value;route()"><option value="">الكل</option>${staffOptions(recFilter.staff)}</select></label>
      <label class="f">النوع<select onchange="recFilter.type=this.value;route()"><option value="">الكل</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === recFilter.type ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="f">العذر<select onchange="recFilter.exc=this.value;route()"><option value="">الكل</option><option value="n" ${recFilter.exc === 'n' ? 'selected' : ''}>بدون عذر</option><option value="y" ${recFilter.exc === 'y' ? 'selected' : ''}>بعذر</option></select></label>
      <label class="f">فارس<select onchange="recFilter.faris=this.value;route()"><option value="">الكل</option><option value="y" ${recFilter.faris === 'y' ? 'selected' : ''}>مسجّل في فارس</option><option value="n" ${recFilter.faris === 'n' ? 'selected' : ''}>غير مسجّل</option></select></label>
    </div>
    ${list.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الاسم</th><th>النوع</th><th>العذر</th><th>فارس</th><th>ملاحظة</th><th>المساءلة</th><th>قرار حسم</th><th></th></tr></thead><tbody>
    ${list.map(r => `<tr><td class="num">${fmtHs(r.date)}<br><small style="color:var(--muted)">${r.date}</small></td><td>${fmtDay(r.date)}</td><td>${esc(staffName(r.staffId))}</td><td>${typePill(r)}</td><td>${excPill(r)}</td><td><button class="pill ${r.faris ? 'ok' : 'muted'}" style="border:0;cursor:pointer" title="اضغط للتبديل" onclick="toggleFaris('${r.id}')">${r.faris ? '✓ مسجّل' : 'غير مسجّل'}</button></td><td style="max-width:220px;font-size:.85rem;color:var(--muted)">${esc(r.note || '')}</td><td>${r.letterId ? `<a href="#letter/${r.letterId}" class="pill acc">مساءلة ${esc(letterNo(r.letterId))}</a>` : (r.excused ? '' : `<a href="#letter/new-${r.id}" class="btn sm">إصدار مساءلة</a>`)}</td><td>${deductCell(r)}</td><td class="actions"><a class="btn sm" href="#records/edit-${r.id}" title="تعديل">${I.edit}</a> <button class="btn sm danger" onclick="delRecord('${r.id}')" title="حذف">${I.trash}</button></td></tr>`).join('')}
    </tbody></table></div><p style="color:var(--muted);font-size:.85rem;margin-top:8px">${list.length} تسجيل</p>` : '<div class="empty">لا توجد تسجيلات مطابقة</div>'}
  </div>
  ${(() => { const nf = S.records.filter(r => !r.faris).sort((a, b) => a.date.localeCompare(b.date)); return `<div class="card"><h2>غياب غير مسجّل في فارس <span class="pill ${nf.length ? 'warn' : 'ok'}">${nf.length}</span></h2>
    ${nf.length ? `<div class="tw"><table><thead><tr><th>التاريخ</th><th>الاسم</th><th>النوع</th><th>العذر</th><th>ملاحظة</th><th></th></tr></thead><tbody>${nf.map(r => `<tr><td class="num">${fmtHs(r.date)}<br><small style="color:var(--muted)">${r.date}</small></td><td><b>${esc(staffName(r.staffId))}</b></td><td>${typePill(r)}</td><td>${excPill(r)}</td><td style="font-size:.85rem;color:var(--muted)">${esc(r.note || '')}</td><td class="actions"><button class="btn sm primary" onclick="toggleFaris('${r.id}')">✓ تم تسجيله في فارس</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">كل حالات الغياب مسجّلة في فارس</div>'}
  </div>`; })()}`;
}
function monthLabel(m) { const d = parse(m + '-01'); return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { month: 'long', year: 'numeric' }).format(d); }
function letterNo(id) { const l = S.letters.find(x => x.id === id); return l ? l.no : ''; }
function staffOptions(sel, onlyActive) { return S.staff.filter(s => !onlyActive || s.active !== false).sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join(''); }
function recordForm(id) {
  const r = id ? S.records.find(x => x.id === id) : { date: todayISO(), type: 'absent', excused: false, minutes: '', note: '', staffId: '' };
  if (!r) return;
  openDlg(`<h2>${id ? 'تعديل التسجيل' : 'تسجيل غياب / تأخر'}</h2>
  <form id="recForm" class="form">
    ${id ? `<label class="f full">المنسوب<select name="staffId" required>${staffOptions(r.staffId, true)}</select></label>` : `<div class="f full"><span style="font-size:.85rem;color:var(--muted);font-weight:500">المنسوبون <small>(يمكن اختيار أكثر من واحد لنفس اليوم)</small></span><input id="pickQ" placeholder="ابحث بالاسم…" oninput="filterPick(this.value)" style="padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><div class="picklist" id="pickList">${S.staff.filter(s => s.active !== false).sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(s => `<label class="check" data-n="${esc(s.name)}"><input type="checkbox" name="staffId" value="${s.id}"> <span>${esc(s.name)}</span> <small style="color:var(--muted)">${esc(s.spec || s.job || '')}</small></label>`).join('')}</div><div id="pickCount" style="font-size:.8rem;color:var(--muted)"></div></div>`}
    <label class="f">التاريخ<input type="date" name="date" value="${r.date}" required max="${todayISO()}"></label>
    <label class="f">التاريخ الهجري<input value="${fmtH(r.date)}" readonly id="hijriPrev" style="background:var(--surface2)"></label>
    <div class="f full"><span style="font-size:.85rem;color:var(--muted);font-weight:500">النوع</span><div class="seg" id="typeSeg">${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-v="${k}" class="${k === r.type ? 'on' : ''}">${v}</button>`).join('')}</div></div>
    <label class="f" id="minWrap" style="${r.type === 'absent' ? 'display:none' : ''}">${r.type === 'early' ? 'دقائق الانصراف المبكر' : 'دقائق التأخر'}<input type="number" name="minutes" min="1" value="${r.minutes || ''}" inputmode="numeric"></label>
    <div class="f" style="justify-content:flex-end;gap:10px"><label class="check"><input type="checkbox" name="excused" ${r.excused ? 'checked' : ''}> بعذر مقبول (لا تُصدر مساءلة)</label><label class="check"><input type="checkbox" name="faris" ${r.faris ? 'checked' : ''}> مسجّل الغياب في فارس</label></div>
    <label class="f full">ملاحظة / سبب<input name="note" value="${esc(r.note || '')}" placeholder="مثال: بدون إشعار، أو نوع العذر"></label>
    <div class="row end full"><button type="button" class="btn" onclick="closeDlg();location.hash='#records'">إلغاء</button><button class="btn primary">${id ? 'حفظ التعديل' : 'حفظ'}</button></div>
  </form>`);
  let type = r.type;
  $('#typeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.v; [...$('#typeSeg').children].forEach(x => x.classList.toggle('on', x === b)); $('#minWrap').style.display = type === 'absent' ? 'none' : ''; $('#minWrap').firstChild.textContent = type === 'early' ? 'دقائق الانصراف المبكر' : 'دقائق التأخر'; };
  $('#recForm [name=date]').oninput = e => { $('#hijriPrev').value = e.target.value ? fmtH(e.target.value) : ''; };
  $('#recForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const ids = id ? [f.get('staffId')] : [...e.target.querySelectorAll('[name=staffId]:checked')].map(o => o.value);
    if (!ids.length) return toast('اختر المنسوب');
    const base = { date: f.get('date'), type, excused: !!f.get('excused'), faris: !!f.get('faris'), minutes: type === 'absent' ? '' : Number(f.get('minutes') || 0) || '', note: f.get('note').trim() };
    if (id) Object.assign(r, base, { updatedAt: Date.now(), updatedBy: session.name });
    else ids.forEach(sid => { if (S.records.some(x => x.staffId === sid && x.date === base.date && x.type === base.type)) return; S.records.push({ id: uid(), staffId: sid, ...base, createdAt: Date.now(), createdBy: session.name }); });
    closeDlg(); location.hash = '#records'; recFilter.month = monthKey(base.date);
    save(id ? 'تم تعديل التسجيل' : `تم تسجيل ${ids.length} حالة`);
  };
}
function filterPick(q) { q = q.trim(); let n = 0; [...$('#pickList').children].forEach(l => { const show = !q || l.dataset.n.includes(q); l.style.display = show ? '' : 'none'; if (show) n++; }); }
document.addEventListener('change', e => { if (e.target.name === 'staffId' && $('#pickCount')) { const n = document.querySelectorAll('#pickList input:checked').length; $('#pickCount').textContent = n ? `تم اختيار ${n}` : ''; } });
function deductCell(r) {
  if (!r.letterId) return '';
  const q = S.letters.find(l => l.id === r.letterId); if (!q) return '';
  const d = S.letters.find(l => l.inquiryId === q.id);
  if (d) return `<a href="#letter/${d.id}" class="pill absent">قرار حسم ${esc(d.no)}</a> <button class="btn sm" title="طباعة قرار الحسم" onclick="printLetters(['${d.id}'])">${I.print}</button>`;
  if (q.decision === 'deduct') return isAdmin() ? `<button class="btn sm primary" onclick="issueDeduction('${q.id}')">إصدار قرار حسم</button>` : '<span class="pill warn">بانتظار قرار الحسم</span>';
  return q.decision ? `<span class="pill muted">${q.decision === 'sick' ? 'إجازة مرضية' : 'إجازة اضطرارية'}</span>` : '<span class="pill muted">لم يُبتّ بعد</span>';
}
function toggleFaris(id) { const r = S.records.find(x => x.id === id); if (!r) return; r.faris = !r.faris; save(r.faris ? 'تم تعليم التسجيل كمسجّل في فارس' : 'تم إلغاء التعليم'); }
function delRecord(id) {
  const r = S.records.find(x => x.id === id); if (!r) return;
  if (r.letterId && !isAdmin()) return toast('هذا التسجيل مرتبط بمساءلة، يحذفه مدير النظام فقط');
  confirmDlg(`حذف تسجيل ${TYPES[r.type]} للمنسوب ${staffName(r.staffId)} بتاريخ ${fmtHs(r.date)}؟`, () => {
    S.records = S.records.filter(x => x.id !== id);
    S.letters.forEach(l => { l.recordIds = l.recordIds.filter(x => x !== id); });
    S.letters = S.letters.filter(l => l.recordIds.length);
    save('تم الحذف');
  });
}

/* ---------- Staff ---------- */
let staffQ = '', staffSort = { key: 'name', dir: 1 };

let curLetterDraft = null;
function collectLetter(l) {

  if (lKind(l) !== 'deduction') d.recordIds = [...f.querySelectorAll('[name=rid]:checked')].map(x => x.value);
  if (fd.get('status')) d.status = fd.get('status'); if (fd.has('reply')) d.reply = fd.get('reply');
  if (fd.has('decision')) d.decision = fd.get('decision'); else if (f.querySelector('[name=decision]')) d.decision = f.querySelector('[name=decision]').value;
  if (fd.has('days')) d.days = Number(fd.get('days')) || 0; if (fd.has('daysText')) d.daysText = fd.get('daysText').trim();
  curLetterDraft = d; return d;
}
function currentBase() { const arg = location.hash.split('/')[1] || ''; if (arg.startsWith('new-')) { const rids = arg.slice(4).split('.'); return curLetterDraft || { id: 'new', kind: 'inquiry', staffId: S.records.find(r => r.id === rids[0]).staffId, recordIds: rids, date: todayISO(), no: '' }; } return S.letters.find(x => x.id === arg); }

document.addEventListener('submit', e => {

    if (!d.recordIds.length) return toast('اختر حالة واحدة على الأقل');

function isConsecutive(rs) { for (let i = 1; i < rs.length; i++) { const a = parse(rs[i - 1].date), b = parse(rs[i].date); const diff = (b - a) / 864e5; if (diff > 3) return false; } return rs.length > 1; }
function loadScript(src) { return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(sc); }); }
async function doPrint(letters) {
  if (!letters.length) return;
  const first = letters[0], st = staffById(first.staffId);
  const name = letters.length === 1 ? `${KINDS[lKind(first)]}-${first.no}-${(st && st.name) || ''}.pdf` : `خطابات-${todayISO()}-${letters.length}.pdf`;

async function printHTML(html, name) {
  const area = $('#printArea'); area.innerHTML = html;
  await document.fonts.ready;
  // Inside the claude.ai viewer the browser print dialog is blocked, so build a PDF and hand it to the viewer.
  const inViewer = !!(window.claude && window.claude.use);
  if (!inViewer) { setTimeout(() => window.print(), 150); return; }
  toast('جارٍ تجهيز ملف PDF…');
  try {
    await Promise.all([loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'), loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);
    area.classList.add('rendering');
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    const pages = [...area.querySelectorAll('.letter')];
    for (let i = 0; i < pages.length; i++) {
      const cv = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 900 });
      if (i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, Math.min(297, 210 * cv.height / cv.width));
    }
    area.classList.remove('rendering'); area.innerHTML = '';
    await saveFile(name, pdf.output('blob'));
  } catch (e) {
    area.classList.remove('rendering');
    toast('تعذر إنشاء الملف: ' + (e.message || e));
  }
}

  <form id="setF" class="form">
    <label class="f">الوزارة<input name="ministry" value="${esc(st.ministry)}"></label>
    <label class="f">إدارة التعليم<input name="region" value="${esc(st.region)}"></label>
    <label class="f full">اسم المدرسة<input name="school" value="${esc(st.school)}" required></label>
    <label class="f">اسم مدير المدرسة<input name="principal" value="${esc(st.principal)}"></label>
    <label class="f">المسمى<input name="principalTitle" value="${esc(st.principalTitle)}"></label>
    <label class="f">السنة الهجرية (تظهر في خانات التاريخ)<input name="year" value="${esc(st.year)}"></label>
    <label class="f">مهلة الرد<input name="replyText" value="${esc(st.replyText)}" placeholder="أسبوع"></label>
    <label class="f">قرار تفويض الصلاحيات (قرار الحسم)<input name="decree" value="${esc(st.decree)}"></label>
    <label class="f">رمز نموذج قرار الحسم<input name="formCode" value="${esc(st.formCode)}"></label>
    <label class="f full">شعار المدرسة / الوزارة (صورة صغيرة)<input type="file" accept="image/*" id="logoIn"></label>
    <div class="full row">${st.logo ? `<img src="${st.logo}" style="height:70px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff"><button type="button" class="btn sm" onclick="S.settings.logo='';save('تم حذف الشعار')">إزالة الشعار</button>` : '<span style="color:var(--muted);font-size:.85rem">لا يوجد شعار</span>'}</div>
    <div class="row end full"><button class="btn primary">حفظ الإعدادات</button></div>
  </form></div>
  <div class="card"><h2>المستخدمون <button class="btn sm primary" onclick="userForm()">${I.plus} إضافة مستخدم</button></h2>
    <div class="tw"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الصلاحية</th><th></th></tr></thead><tbody>${S.users.map(u => `<tr><td>${esc(u.name)}</td><td dir="ltr" style="text-align:right">${esc(u.username)}</td><td><span class="pill ${u.role === 'admin' ? 'acc' : 'muted'}">${u.role === 'admin' ? 'مدير النظام' : 'مسجّل بيانات'}</span></td><td class="actions"><button class="btn sm" onclick="userForm('${u.id}')">${I.edit}</button> ${u.id !== session.id ? `<button class="btn sm danger" onclick="delUser('${u.id}')">${I.trash}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
    <p style="color:var(--muted);font-size:.85rem;margin-top:10px">مدير النظام: كل الصلاحيات. مسجّل البيانات: تسجيل الغياب وإصدار المساءلات وطباعتها فقط.<br>ملاحظة: حتى يتمكن مستخدم آخر من الحفظ سحابياً، شارك معه رابط التطبيق بصلاحية التحرير من claude.ai.</p>
  </div>
  <div class="card"><h2>النسخ الاحتياطي</h2>
    <div class="row"><button class="btn" onclick="backup()">${I.down} تنزيل نسخة كاملة (JSON)</button><label class="btn">استعادة من نسخة <input type="file" accept=".json" hidden onchange="restore(this)"></label></div>
    <p style="color:var(--muted);font-size:.85rem;margin-top:10px">${S.staff.length} منسوب · ${S.records.length} تسجيل · ${S.letters.length} مساءلة</p>
  </div>`;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'setF') return; e.preventDefault();
  const f = new FormData(e.target);
  ['ministry', 'region', 'school', 'principal', 'principalTitle', 'year', 'replyText', 'decree', 'formCode'].forEach(k => S.settings[k] = f.get(k).trim());
  const file = $('#logoIn').files[0];
  if (file) { shrinkImage(file).then(d => { S.settings.logo = d; save('تم حفظ الإعدادات'); }); } else save('تم حفظ الإعدادات');
});
function shrinkImage(file) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); const k = Math.min(1, 240 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.src = URL.createObjectURL(file); });
}
function userForm(id) {
  const u = id ? S.users.find(x => x.id === id) : { name: '', username: '', role: 'entry' };
  openDlg(`<h2>${id ? 'تعديل مستخدم' : 'إضافة مستخدم'}</h2><form id="uf" class="form">
    <label class="f full">الاسم<input name="name" value="${esc(u.name)}" required></label>
    <label class="f">اسم المستخدم<input name="username" value="${esc(u.username)}" required dir="ltr" style="text-align:right"></label>
    <label class="f">الصلاحية<select name="role"><option value="entry" ${u.role === 'entry' ? 'selected' : ''}>مسجّل بيانات</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>مدير النظام</option></select></label>
    <label class="f full">${id ? 'كلمة مرور جديدة (اتركها فارغة للإبقاء على الحالية)' : 'كلمة المرور'}<input name="password" type="password" ${id ? '' : 'required'} autocomplete="new-password"></label>
    <div class="row end full"><button type="button" class="btn" onclick="closeDlg()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`);
  $('#uf').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const un = f.get('username').trim(), p = f.get('password');
    if (S.users.some(x => x.username.toLowerCase() === un.toLowerCase() && x.id !== id)) return toast('اسم المستخدم مستخدم مسبقاً');
    const d = { name: f.get('name').trim(), username: un, role: f.get('role') };
    if (p) d.hash = await sha(un.toLowerCase() + ':' + p); else if (id && un.toLowerCase() !== u.username.toLowerCase()) return toast('عند تغيير اسم المستخدم يجب إدخال كلمة مرور جديدة');
    if (id) Object.assign(u, d); else S.users.push({ id: uid(), ...d });
    if (id === session.id) setSession(u);
    closeDlg(); save('تم حفظ المستخدم');
  };
}
function delUser(id) { confirmDlg(`حذف المستخدم ${S.users.find(u => u.id === id)?.name}؟`, () => { S.users = S.users.filter(u => u.id !== id); save('تم حذف المستخدم'); }); }
function backup() { saveFile('نسخة-سجل-الغياب-' + todayISO() + '.json', new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); }
function restore(inp) {
  const file = inp.files[0]; if (!file) return;
  file.text().then(t => { const d = JSON.parse(t); if (!d.v || !Array.isArray(d.staff)) throw 0; confirmDlg(`استبدال كل البيانات الحالية بالنسخة (${d.staff.length} منسوب، ${d.records.length} تسجيل)؟`, () => { const me = S.users.find(u => u.id === session.id); S = d; if (me && !S.users.some(u => u.id === me.id)) S.users.push(me); save('تمت الاستعادة'); }); }).catch(() => toast('الملف غير صالح'));
}

/* ---------- Boot ---------- */
route();
try { const p = sessionStorage.getItem('absence-print'); if (p && session) { sessionStorage.removeItem('absence-print'); setTimeout(() => printLetters(JSON.parse(p)), 600); } } catch (e) {}

</script>
</body>
</html>
